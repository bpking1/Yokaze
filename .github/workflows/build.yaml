name: ypm Windows TUI

# Personal fork: only the Windows TUI is built, as a workflow artifact.
# The macOS/Linux desktop packages, the release drafting and the updater
# feed all depended on signing secrets this fork does not carry.

on:
  push:
    branches: [fork]
    # Documentation and renderer changes cannot reach the TUI binary.
    paths:
      - src-tauri/**
      - .github/workflows/build.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ypm-windows-x64:
    name: ypm windows-x64
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: clippy,rustfmt
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Formatting is a matter of seconds and fails for reasons the compiler
      # would not explain, so it goes first.
      - name: Check ypm formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -p yesplaymusic-tui -- --check

      # `TAURI_UPDATER_PUBKEY` is intentionally unset: `ypm update` verifies
      # release signatures against the embedded key and stays disabled when none
      # is defined, preventing this fork build from replacing itself with an
      # upstream binary.
      - name: Build ypm
        run: cargo build --locked --release --manifest-path src-tauri/Cargo.toml -p yesplaymusic-tui --target x86_64-pc-windows-msvc

      - name: Smoke ypm runtime
        shell: bash
        run: '"src-tauri/target/x86_64-pc-windows-msvc/release/ypm.exe" --version'

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist-ypm
          cp "src-tauri/target/x86_64-pc-windows-msvc/release/ypm.exe" "dist-ypm/ypm-windows-x64.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: ypm-x86_64-pc-windows-msvc
          path: dist-ypm/
          if-no-files-found: error

      # The binary is already uploaded by now: a failure below leaves the
      # run red while the artifact stays downloadable.
      - name: Test ypm and core
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -p yesplaymusic-tui -p yesplaymusic-core --all-features

      - name: Clippy ypm
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml -p yesplaymusic-tui --all-targets -- -D warnings
